{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — EduCore</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body style="background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
<div style="text-align:center;max-width:480px;">
  <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:28px;font-weight:900;color:var(--primary);margin-bottom:32px;">Edu<span style="color:var(--accent);">Core</span></div>
  <div style="width:80px;height:80px;background:rgba(30,58,138,0.08);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
    <i class="fas fa-map-signs" style="font-size:32px;color:var(--primary);opacity:0.4;"></i>
  </div>
  <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:72px;font-weight:900;color:var(--primary);line-height:1;margin-bottom:8px;">404</h1>
  <h2 style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:12px;">Page Not Found</h2>
  <p style="font-size:15px;color:var(--text-muted);line-height:1.7;margin-bottom:32px;">The page you are looking for does not exist or has been moved. Let us get you back on track.</p>
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
    <a href="/" style="padding:12px 24px;background:var(--primary);color:white;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;"><i class="fas fa-home"></i> Go to Home</a>
    {% if user.is_authenticated %}
    <a href="/dashboard/" style="padding:12px 24px;background:white;color:var(--primary);border:1.5px solid var(--border);border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;"><i class="fas fa-th-large"></i> Go to Dashboard</a>
    {% else %}
    <a href="/login/" style="padding:12px 24px;background:white;color:var(--primary);border:1.5px solid var(--border);border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;"><i class="fas fa-sign-in-alt"></i> Sign In</a>
    {% endif %}
  </div>
</div>
</body>
</html>
