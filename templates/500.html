{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Error — EduCore</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body style="background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
<div style="text-align:center;max-width:480px;">
  <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:28px;font-weight:900;color:var(--primary);margin-bottom:32px;">Edu<span style="color:var(--accent);">Core</span></div>
  <div style="width:80px;height:80px;background:rgba(239,68,68,0.08);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
    <i class="fas fa-exclamation-triangle" style="font-size:32px;color:#EF4444;opacity:0.5;"></i>
  </div>
  <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:72px;font-weight:900;color:#EF4444;line-height:1;margin-bottom:8px;">500</h1>
  <h2 style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:12px;">Something Went Wrong</h2>
  <p style="font-size:15px;color:var(--text-muted);line-height:1.7;margin-bottom:32px;">Our team has been notified and we are working to fix this. Please try again in a moment.</p>
  <a href="/" style="padding:12px 24px;background:var(--primary);color:white;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;margin:0 auto;"><i class="fas fa-home"></i> Go to Home</a>
</div>
</body>
</html>
