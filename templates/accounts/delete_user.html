{% extends 'base.html' %}
{% block title %}Delete User{% endblock %}
{% block content %}
<div class="page-header"><div><h1><i class="fas fa-trash"></i> Delete User</h1></div><a href="{% url 'users_list' %}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a></div>
<div class="card" style="max-width:480px;"><div class="card-body" style="text-align:center;padding:40px;">
<i class="fas fa-exclamation-triangle" style="font-size:48px;color:var(--danger);"></i>
<h3 style="margin-top:16px;">Are you sure?</h3>
<p style="color:var(--text-muted);margin-top:8px;">Delete <strong>{{ edit_user.get_full_name|default:edit_user.username }}</strong>? This cannot be undone.</p>
<form method="post" style="margin-top:24px;display:flex;gap:12px;justify-content:center;">{% csrf_token %}
<button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Yes, Delete</button>
<a href="{% url 'users_list' %}" class="btn btn-outline">Cancel</a>
</form>
</div></div>
{% endblock %}
