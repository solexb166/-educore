{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div style="max-width:480px;margin:60px auto;">
  <div class="card">
    <div class="card-header"><h5><i class="fas fa-lock" style="color:var(--primary);"></i> Set Your Password</h5></div>
    <div class="card-body">
      <div class="alert alert-info"><i class="fas fa-info-circle"></i> Please set a personal password to continue using EduCore.</div>
      <form method="post">{% csrf_token %}
        <div class="form-group"><label class="form-label">New Password</label><input type="password" name="new_password" class="form-control" placeholder="Minimum 6 characters" required></div>
        <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;"><i class="fas fa-save"></i> Save Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
